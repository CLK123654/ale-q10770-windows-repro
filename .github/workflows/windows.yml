name: NativeWindowsPortability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ReviewPortableContract
        shell: pwsh
        run: node verification/static_portability.mjs
